<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Determinants & Geometric Area/Volume Visualizer</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .controls { display: flex; gap: 30px; background: #222; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    canvas { background: #000; border: 2px solid #444; border-radius: 8px; }
    input[type=number] { width: 50px; height: 30px; text-align: center; background: #333; color: #fff; border: 1px solid #666; font-size: 16px; }
    .info { font-size: 18px; color: #00d2d3; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Topic 4: Determinants & Area Scaling Visualizer</h2>
  
  <div class="controls">
    <div>
      <h3>2D Transformation Matrix M</h3>
      <table>
        <tr>
          <td><input type="number" id="m00" value="2" step="0.5" oninput="draw()"></td>
          <td><input type="number" id="m01" value="1" step="0.5" oninput="draw()"></td>
        </tr>
        <tr>
          <td><input type="number" id="m10" value="0.5" step="0.5" oninput="draw()"></td>
          <td><input type="number" id="m11" value="1.5" step="0.5" oninput="draw()"></td>
        </tr>
      </table>
    </div>
    <div>
      <h3>Geometric Interpretation</h3>
      <div id="detVal" class="info">det(M) = 0</div>
      <p>Original Unit Square Area = 1.0</p>
      <p>Transformed Parallelogram Area = |det(M)|</p>
    </div>
  </div>

  <canvas id="cvs" width="500" height="500"></canvas>

  <script>
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');

    function draw() {
      const a = parseFloat(document.getElementById('m00').value) || 0;
      const b = parseFloat(document.getElementById('m01').value) || 0;
      const c = parseFloat(document.getElementById('m10').value) || 0;
      const d = parseFloat(document.getElementById('m11').value) || 0;

      const det = a * d - b * c;
      document.getElementById('detVal').innerText = `det(M) = (${a} × ${d}) - (${b} × ${c}) = ${det.toFixed(2)}`;

      ctx.clearRect(0, 0, cvs.width, cvs.height);
      
      // Setup Canvas Origin (Center)
      ctx.save();
      ctx.translate(cvs.width / 2, cvs.height / 2);
      ctx.scale(1, -1); // Flip Y to standard Cartesian
      
      const scale = 50; // Scale 1 unit = 50px

      // Draw Grid Axes
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      ctx.moveTo(-250, 0); ctx.lineTo(250, 0);
      ctx.moveTo(0, -250); ctx.lineTo(0, 250);
      ctx.stroke();

      // Original Unit Square (0,0)->(1,0)->(1,1)->(0,1)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.strokeStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(1 * scale, 0);
      ctx.lineTo(1 * scale, 1 * scale);
      ctx.lineTo(0, 1 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Transformed Basis Vectors: e1' = (a, c), e2' = (b, d)
      const p1 = { x: a * scale, y: c * scale };
      const p2 = { x: (a + b) * scale, y: (c + d) * scale };
      const p3 = { x: b * scale, y: d * scale };

      // Transformed Parallelogram
      ctx.fillStyle = det >= 0 ? 'rgba(0, 255, 136, 0.4)' : 'rgba(255, 77, 77, 0.4)';
      ctx.strokeStyle = det >= 0 ? '#00ff88' : '#ff4d4d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Draw Vectors e1' and e2'
      ctx.strokeStyle = '#ffdd59'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(p1.x, p1.y); ctx.stroke();
      ctx.strokeStyle = '#00a8ff'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(p3.x, p3.y); ctx.stroke();

      ctx.restore();
    }

    draw();
  </script>
<script>document.body.dataset.mathTopic='determinants';</script><script src="../math-explainer.js"></script></body>
</html>
