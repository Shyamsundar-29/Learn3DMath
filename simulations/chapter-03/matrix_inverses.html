<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Inverses & Gauss-Jordan Visualizer</title>
  <style>
    body { font-family: sans-serif; background: #181818; color: #f0f0f0; padding: 20px; }
    table { border-collapse: collapse; margin: 10px 0; }
    td { padding: 4px; }
    input[type=number] { width: 45px; height: 35px; text-align: center; background: #282828; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 15px; }
    button { background: #8e44ad; color: white; border: none; padding: 10px 18px; font-size: 15px; border-radius: 4px; cursor: pointer; margin: 5px 0; }
    button:hover { background: #9b59b6; }
    .matrix-display { font-family: monospace; background: #222; padding: 12px; border-radius: 6px; white-space: pre-wrap; margin-top: 10px; color: #00e676; line-height: 1.4; }
    .error { color: #ff5252; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Topic 3: Matrix Inverses (Gauss-Jordan Elimination)</h2>
  <p>Input a 3×3 matrix <strong>M</strong> to compute <strong>M⁻¹</strong> using [M | I] → [I | M⁻¹].</p>

  <table>
    <tr>
      <td><input type="number" id="m00" value="1"></td>
      <td><input type="number" id="m01" value="0"></td>
      <td><input type="number" id="m02" value="2"></td>
    </tr>
    <tr>
      <td><input type="number" id="m10" value="2"></td>
      <td><input type="number" id="m11" value="-1"></td>
      <td><input type="number" id="m12" value="3"></td>
    </tr>
    <tr>
      <td><input type="number" id="m20" value="4"></td>
      <td><input type="number" id="m21" value="1"></td>
      <td><input type="number" id="m22" value="8"></td>
    </tr>
  </table>

  <button onclick="computeInverse()">Compute Matrix Inverse M⁻¹</button>

  <h3>Computed Inverse M⁻¹</h3>
  <div id="inverseResult" class="matrix-display">Click button to compute...</div>

  <h3>Verification: M × M⁻¹ (Should equal I₃)</h3>
  <div id="verifyResult" class="matrix-display">...</div>

  <script>
    function computeInverse() {
      let M = [
        [parseFloat(document.getElementById('m00').value)||0, parseFloat(document.getElementById('m01').value)||0, parseFloat(document.getElementById('m02').value)||0],
        [parseFloat(document.getElementById('m10').value)||0, parseFloat(document.getElementById('m11').value)||0, parseFloat(document.getElementById('m12').value)||0],
        [parseFloat(document.getElementById('m20').value)||0, parseFloat(document.getElementById('m21').value)||0, parseFloat(document.getElementById('m22').value)||0]
      ];

      // Build Augmented Matrix [M | I]
      let aug = [];
      for (let i = 0; i < 3; i++) {
        aug.push([M[i][0], M[i][1], M[i][2], i===0?1:0, i===1?1:0, i===2?1:0]);
      }

      // Gauss-Jordan
      for (let i = 0; i < 3; i++) {
        let maxRow = i;
        for (let k = i + 1; k < 3; k++) {
          if (Math.abs(aug[k][i]) > Math.abs(aug[maxRow][i])) maxRow = k;
        }
        let temp = aug[i]; aug[i] = aug[maxRow]; aug[maxRow] = temp;

        if (Math.abs(aug[i][i]) < 1e-7) {
          document.getElementById('inverseResult').innerHTML = "<span class='error'>Matrix is Singular (Determinant = 0). It does NOT have an inverse!</span>";
          document.getElementById('verifyResult').innerText = "N/A";
          return;
        }

        let p = aug[i][i];
        for (let j = 0; j < 6; j++) aug[i][j] /= p;

        for (let r = 0; r < 3; r++) {
          if (r !== i) {
            let factor = aug[r][i];
            for (let c = 0; c < 6; c++) aug[r][c] -= factor * aug[i][c];
          }
        }
      }

      let Inv = [];
      let invText = "";
      for (let i = 0; i < 3; i++) {
        let row = [aug[i][3], aug[i][4], aug[i][5]];
        Inv.push(row);
        invText += `[ ${row[0].toFixed(4).padStart(8)}  ${row[1].toFixed(4).padStart(8)}  ${row[2].toFixed(4).padStart(8)} ]\n`;
      }
      document.getElementById('inverseResult').innerText = invText;

      // Verification Product
      let Ver = [[0,0,0],[0,0,0],[0,0,0]];
      let verText = "";
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          let s = 0;
          for (let k = 0; k < 3; k++) s += M[i][k] * Inv[k][j];
          Ver[i][j] = Math.abs(s) < 1e-6 ? 0 : s;
        }
        verText += `[ ${Ver[i][0].toFixed(2).padStart(6)}  ${Ver[i][1].toFixed(2).padStart(6)}  ${Ver[i][2].toFixed(2).padStart(6)} ]\n`;
      }
      document.getElementById('verifyResult').innerText = verText;
    }
  </script>
<script>document.body.dataset.mathTopic='matrix-inverses';</script><script src="../math-explainer.js"></script></body>
</html>
