<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Linear Systems & Gaussian Elimination Visualizer</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
    .system-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 18px; }
    input[type=number] { width: 50px; height: 30px; text-align: center; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; font-size: 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #218838; }
    .step-box { background: #2b2b2b; border-left: 4px solid #007bff; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; font-size: 13px; }
    .solution { background: #3d3100; border: 1px solid #ffc107; padding: 15px; border-radius: 5px; font-size: 18px; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Topic 2: Linear Systems (Ax = b) & Gaussian Elimination</h2>
  <p>Modify the coefficients and constant vector, then solve with step-by-step pivoting logs.</p>
  
  <div id="systemInputs">
    <!-- Equation 1 -->
    <div class="system-row">
      <input type="number" id="a00" value="3"> x + 
      <input type="number" id="a01" value="2"> y + 
      <input type="number" id="a02" value="-3"> z = 
      <input type="number" id="b0" value="-13">
    </div>
    <!-- Equation 2 -->
    <div class="system-row">
      <input type="number" id="a10" value="4"> x + 
      <input type="number" id="a11" value="-3"> y + 
      <input type="number" id="a12" value="6"> z = 
      <input type="number" id="b1" value="7">
    </div>
    <!-- Equation 3 -->
    <div class="system-row">
      <input type="number" id="a20" value="1"> x + 
      <input type="number" id="a21" value="0"> y + 
      <input type="number" id="a22" value="-1"> z = 
      <input type="number" id="b2" value="-5">
    </div>
  </div>

  <button onclick="solveSystem()">Solve System Step-by-Step</button>

  <div id="solutionBox" class="solution" style="display:none;"></div>
  <h3>Algorithm Trace Steps</h3>
  <div id="stepsContainer"></div>

  <script>
    function solveSystem() {
      let M = [
        [parseFloat(document.getElementById('a00').value)||0, parseFloat(document.getElementById('a01').value)||0, parseFloat(document.getElementById('a02').value)||0, parseFloat(document.getElementById('b0').value)||0],
        [parseFloat(document.getElementById('a10').value)||0, parseFloat(document.getElementById('a11').value)||0, parseFloat(document.getElementById('a12').value)||0, parseFloat(document.getElementById('b1').value)||0],
        [parseFloat(document.getElementById('a20').value)||0, parseFloat(document.getElementById('a21').value)||0, parseFloat(document.getElementById('a22').value)||0, parseFloat(document.getElementById('b2').value)||0]
      ];

      const stepsDiv = document.getElementById('stepsContainer');
      const solDiv = document.getElementById('solutionBox');
      stepsDiv.innerHTML = "";
      solDiv.style.display = "none";

      function logMat(title, mat) {
        let s = `<strong>${title}</strong>\n`;
        for(let r=0; r<3; r++) {
          s += `[ ${mat[r][0].toFixed(2).padStart(7)} ${mat[r][1].toFixed(2).padStart(7)} ${mat[r][2].toFixed(2).padStart(7)} | ${mat[r][3].toFixed(2).padStart(7)} ]\n`;
        }
        let box = document.createElement('div');
        box.className = 'step-box';
        box.innerHTML = s;
        stepsDiv.appendChild(box);
      }

      logMat("Initial Augmented Matrix [A | b]:", M);

      let n = 3;
      for (let i = 0; i < n; i++) {
        // Pivoting
        let maxRow = i;
        for (let k = i + 1; k < n; k++) {
          if (Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
        }
        if (maxRow !== i) {
          let temp = M[i]; M[i] = M[maxRow]; M[maxRow] = temp;
          logMat(`Pivot: Swapped Row ${i+1} with Row ${maxRow+1}`, M);
        }

        if (Math.abs(M[i][i]) < 1e-8) {
          solDiv.style.display = "block";
          solDiv.innerText = "System has no unique solution (Singular or Dependent Matrix).";
          return;
        }

        // Scale pivot row
        let pivotVal = M[i][i];
        for (let j = i; j <= n; j++) M[i][j] /= pivotVal;
        logMat(`Scaled Row ${i+1} by 1 / ${pivotVal.toFixed(2)} to get leading 1`, M);

        // Eliminate column entries
        for (let r = 0; r < n; r++) {
          if (r !== i) {
            let factor = M[r][i];
            for (let c = i; c <= n; c++) M[r][c] -= factor * M[i][c];
          }
        }
        logMat(`Cleared Column ${i+1} for all other rows`, M);
      }

      solDiv.style.display = "block";
      solDiv.innerHTML = `<strong>Solution Vector (x, y, z):</strong><br>x = ${M[0][3].toFixed(4)}<br>y = ${M[1][3].toFixed(4)}<br>z = ${M[2][3].toFixed(4)}`;
    }
  </script>
<script>document.body.dataset.mathTopic='linear-systems';</script><script src="../math-explainer.js"></script></body>
</html>
