<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Determinant Explorer</title><style>body{margin:0;padding:24px;font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;text-align:center}.wrap{max-width:850px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0}.vector{padding:10px;background:#1e293b;border-radius:8px}input{width:52px;padding:6px;background:#0f172a;color:#fff;border:1px solid #64748b;border-radius:4px}canvas{max-width:100%;background:#020617;border-radius:8px}.result{font-size:1.15rem;color:#7dd3fc;font-weight:700}</style></head><body data-math-topic="determinant-3d"><main class="wrap"><h2>3D Determinants: Volume from Three Vectors</h2><p>Change the three vectors. The coloured shape is their parallelepiped; its volume is |det(A)|.</p><div class="controls" id="controls"></div><canvas id="canvas" width="700" height="420"></canvas><p class="result" id="result"></p></main><script>const vectors=[[3,0,0],[1,2,0],[1,1,2]], names=['a','b','c'], colors=['#fb7185','#60a5fa','#34d399'];const controls=document.querySelector('#controls');vectors.forEach((v,i)=>{const box=document.createElement('div');box.className='vector';box.innerHTML=`<b>${names[i]}</b> = ${v.map((n,j)=>`<input type="number" value="${n}" aria-label="${names[i]} ${'xyz'[j]}">`).join(' ')}`;box.querySelectorAll('input').forEach((input,j)=>input.oninput=()=>{vectors[i][j]=Number(input.value)||0;draw()});controls.append(box)});const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');function p(v){return [350+v[0]*55+v[2]*25,250-v[1]*55-v[2]*25]}function line(a,b,color,w=2){const A=p(a),B=p(b);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke()}function add(...vs){return vs.reduce((r,v)=>r.map((n,i)=>n+v[i]),[0,0,0])}function draw(){ctx.clearRect(0,0,700,420);line([-5,0,0],[5,0,0],'#475569');line([0,-3,0],[0,3,0],'#475569');line([0,0,-4],[0,0,4],'#475569');const [a,b,c]=vectors,ab=add(a,b),ac=add(a,c),bc=add(b,c),abc=add(a,b,c);[[[0,0,0],a],[[0,0,0],b],[[0,0,0],c],[a,ab],[a,ac],[b,ab],[b,bc],[c,ac],[c,bc],[ab,abc],[ac,abc],[bc,abc]].forEach(([x,y])=>line(x,y,'#94a3b8'));vectors.forEach((v,i)=>line([0,0,0],v,colors[i],4));const det=a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]);document.querySelector('#result').textContent=`det(A) = ${det.toFixed(2)}; volume = ${Math.abs(det).toFixed(2)} cubic units${Math.abs(det)<.0001?' — flat shape (no volume).':''}`;}draw()</script><script src="../math-explainer.js"></script></body></html>
