<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vector Visualizer (2D Plane Projection)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:24px; font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; }
    main { max-width:1060px; margin:auto; }
    h2 { margin:0 0 5px; } .intro { margin:0 0 18px; color:#94a3b8; }
    .layout { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(270px,1fr); gap:18px; }
    .scene,.panel { padding:18px; background:#172033; border:1px solid #334155; border-radius:12px; }
    canvas { display:block; width:100%; background:radial-gradient(circle at 50% 45%,#182846,#020617 72%); border:1px solid #475569; border-radius:9px; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .controls h3 { grid-column:span 2; margin:0; color:#7dd3fc; font-size:15px; }
    label { display:grid; grid-template-columns:30px 1fr 45px; gap:7px; align-items:center; font-size:13px; } input { accent-color:#38bdf8; } output { color:#7dd3fc; font-variant-numeric:tabular-nums; }
    .math { margin-top:14px; padding:12px; border-radius:8px; background:#020617; border:1px solid #1e3a5f; font-family:ui-monospace,monospace; line-height:1.7; color:#e0f2fe; }
    .legend { display:flex; gap:13px; flex-wrap:wrap; margin-top:10px; font-size:12px; } .legend span::before { content:'●'; margin-right:5px; } .p::before{color:#fb7185}.q::before{color:#4ade80}.sum::before{color:#22d3ee}
    @media(max-width:760px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main><h2>3D Vector Addition Lab</h2><p class="intro">Move the components or rotate the view. P, Q, and their sum are drawn in the same 3D space.</p><div class="layout"><section class="scene"><canvas id="canvas" width="680" height="520"></canvas><div class="legend"><span class="p">P</span><span class="q">Q</span><span class="sum">P + Q</span></div></section><section class="panel"><div class="controls"><h3>Vector P</h3><label>Px <input type="range" id="px" min="-5" max="5" step=".1" value="2"><output></output></label><label>Py <input type="range" id="py" min="-5" max="5" step=".1" value="2"><output></output></label><label>Pz <input type="range" id="pz" min="-5" max="5" step=".1" value="1"><output></output></label><h3>Vector Q</h3><label>Qx <input type="range" id="qx" min="-5" max="5" step=".1" value="-1"><output></output></label><label>Qy <input type="range" id="qy" min="-5" max="5" step=".1" value="1.5"><output></output></label><label>Qz <input type="range" id="qz" min="-5" max="5" step=".1" value="2"><output></output></label><h3>Camera</h3><label>Yaw <input type="range" id="yaw" min="-180" max="180" value="35"><output></output></label></div><div class="math" id="currentMath"></div></section></div></main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const val = id => Number(document.getElementById(id).value);
    const project = ([x,y,z]) => { const yaw=val('yaw')*Math.PI/180, rx=x*Math.cos(yaw)-z*Math.sin(yaw), rz=x*Math.sin(yaw)+z*Math.cos(yaw), scale=56/(1+Math.max(-.35,rz*.06)); return [canvas.width/2+rx*scale,canvas.height/2-y*scale]; };
    function drawLine(a,b,color,width=2,label=''){const A=project(a),B=project(b),angle=Math.atan2(B[1]-A[1],B[0]-A[0]);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke();if(width>2){ctx.beginPath();ctx.moveTo(...B);ctx.lineTo(B[0]-10*Math.cos(angle-.45),B[1]-10*Math.sin(angle-.45));ctx.lineTo(B[0]-10*Math.cos(angle+.45),B[1]-10*Math.sin(angle+.45));ctx.closePath();ctx.fill()}if(label){ctx.font='600 14px system-ui';ctx.fillText(label,B[0]+8,B[1]-8)}}
    function render() { const p=[val('px'),val('py'),val('pz')],q=[val('qx'),val('qy'),val('qz')],sum=p.map((x,i)=>x+q[i]); ctx.clearRect(0,0,canvas.width,canvas.height); for(let g=-5;g<=5;g++){drawLine([g,0,-5],[g,0,5],'#18243c');drawLine([-5,0,g],[5,0,g],'#18243c')}drawLine([-5,0,0],[5,0,0],'#94a3b8',2,'x');drawLine([0,-5,0],[0,5,0],'#94a3b8',2,'y');drawLine([0,0,-5],[0,0,5],'#94a3b8',2,'z');drawLine([0,0,0],p,'#fb7185',4,'P');drawLine(p,sum,'#4ade80',4,'Q');drawLine([0,0,0],sum,'#22d3ee',4,'P + Q');const length=Math.hypot(...sum);document.getElementById('currentMath').innerHTML=`<b>Live calculation</b><br>P + Q = (${p.join(', ')}) + (${q.join(', ')})<br>= <b>(${sum.map(x=>x.toFixed(1)).join(', ')})</b><br>|P + Q| = √(${sum.map(x=>`${x.toFixed(1)}²`).join(' + ')}) = <b>${length.toFixed(2)}</b>`; }

    document.querySelectorAll('input').forEach((el) => { el.nextElementSibling.textContent=el.value; el.addEventListener('input', () => { el.nextElementSibling.textContent=el.value; render(); }); });
    render();
  </script>
<script>document.body.dataset.mathTopic='vector-properties';</script><script src="../math-explainer.js"></script></body>
</html>
