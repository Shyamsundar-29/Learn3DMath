<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cross Product 3D Interactive Simulation</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; }
        canvas { border: 1px solid #444; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>3D Cross Product Visualization</h2>
    <p>Drag mouse to rotate view. Red = Vector P | Blue = Vector Q | Green = P x Q</p>
    <canvas id="c" width="600" height="450"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let rotX = 0.4, rotY = 0.6;
        let isDragging = false, lastMouseX = 0, lastMouseY = 0;

        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', e => {
            if (isDragging) {
                rotY += (e.clientX - lastMouseX) * 0.01;
                rotX += (e.clientY - lastMouseY) * 0.01;
                lastMouseX = e.clientX; lastMouseY = e.clientY;
                render();
            }
        });

        function project(x, y, z) {
            // Apply rotations
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            let x1 = x * cosY - z * sinY;
            let z1 = x * sinY + z * cosY;

            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;

            let scale = 300 / (z2 + 400);
            return { x: 300 + x1 * scale, y: 225 - y2 * scale };
        }

        function drawLine(p1, p2, color, width=2) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, 600, 450);
            const origin = project(0, 0, 0);

            // Vector P (Red)
            const P = { x: 100, y: 0, z: 0 };
            // Vector Q (Blue)
            const Q = { x: 0, y: 0, z: 100 };
            // P x Q (Green) -> (0*0 - 0*100, 0*0 - 100*100, 100*0 - 0*0) = (0, -10000, 0) -> normalized = (0, 100, 0)
            const Cross = { x: 0, y: 100, z: 0 };

            drawLine(origin, project(P.x, P.y, P.z), '#ff4444', 3);
            drawLine(origin, project(Q.x, Q.y, Q.z), '#4444ff', 3);
            drawLine(origin, project(Cross.x, Cross.y, Cross.z), '#44ff44', 4);
        }

        render();
    </script>
<script>document.body.dataset.mathTopic='cross-product';</script><script src="../math-explainer.js"></script></body>
</html>
