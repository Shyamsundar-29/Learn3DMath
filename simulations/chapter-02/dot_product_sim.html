<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dot Product Interactive Simulation</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #2a2a2a; border: 2px solid #555; margin-top: 10px; border-radius: 8px; }
        .controls { margin-top: 15px; }
    </style>
</head>
<body>
    <h2>Vector Dot Product Simulation</h2>
    <canvas id="canvas" width="500" height="400"></canvas>
    <div class="controls">
        <label>Angle: <input type="range" id="angleSlider" min="0" max="360" value="45"></label>
        <span id="angleVal">45°</span>
    </div>
    <div id="info" style="margin-top:10px; font-weight:bold;"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('angleSlider');
        const angleVal = document.getElementById('angleVal');
        const info = document.getElementById('info');

        const center = { x: 250, y: 200 };
        const p = { x: 150, y: 0 }; // Fixed Vector P along X-axis

        function draw() {
            const deg = parseFloat(slider.value);
            angleVal.innerText = deg + "°";
            const rad = deg * Math.PI / 180;

            const q = { x: 150 * Math.cos(rad), y: -150 * Math.sin(rad) }; // Inverted Y for screen coordinates

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Axes
            ctx.strokeStyle = '#444';
            ctx.beginPath();
            ctx.moveTo(0, center.y); ctx.lineTo(canvas.width, center.y);
            ctx.moveTo(center.x, 0); ctx.lineTo(center.x, canvas.height);
            ctx.stroke();

            // Vector P (Red)
            drawArrow(center.x, center.y, center.x + p.x, center.y + p.y, '#ff5555', 'P');

            // Vector Q (Blue)
            drawArrow(center.x, center.y, center.x + q.x, center.y + q.y, '#55ffff', 'Q');

            // Normalized Dot Product
            const dot = (p.x * q.x + (-p.y) * (-q.y)) / (150 * 150);
            info.innerText = `Dot Product (Normalized): ${dot.toFixed(3)}`;
            info.style.color = dot > 0.01 ? '#55ff55' : (dot < -0.01 ? '#ff5555' : '#ffff55');
        }

        function drawArrow(fromx, derivedy, tox, toy, color, label) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fromx, derivedy);
            ctx.lineTo(tox, toy);
            ctx.stroke();

            const angle = Math.atan2(toy - derivedy, tox - fromx);
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - 12 * Math.cos(angle - Math.PI / 6), toy - 12 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - 12 * Math.cos(angle + Math.PI / 6), toy - 12 * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            ctx.font = '16px sans-serif';
            ctx.fillText(label, tox + 10, toy + 10);
        }

        slider.addEventListener('input', draw);
        draw();
    </script>
<script>document.body.dataset.mathTopic='dot-product';</script><script src="../math-explainer.js"></script></body>
</html>
